plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.streann.insidead'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34

        aarMetadata {
            minCompileSdk = 24
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // java.time (Instant/LocalTime/DayOfWeek) is used by the campaign models and
        // filtering, and is part of the public API surface. It is API 26+ on the platform,
        // so desugaring is what allows minSdk 23. Consuming apps below minSdk 26 must
        // enable core library desugaring too - it is applied at the app's dex step.
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        // CampaignsFilterUtil calls android.util.Log; without this the unit tests fail
        // with "Method i in android.util.Log not mocked".
        unitTests.returnDefaultValues = true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Pinned to 1.2.2: 1.2.3 breaks the release L8 task with
    // "Missing class jdk.internal.misc.Unsafe" (ConcurrentHashMap$TreeBin). Only the release
    // variant shrinks the desugar library, so debug builds do not catch it.
    // 2.x is not an option here - it requires AGP 7.4+ and this project is on 7.3.1.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'

    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "androidx.palette:palette-ktx:1.0.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.ads.interactivemedia.v3:interactivemedia:3.33.0'
    implementation 'com.google.android.gms:play-services-ads:24.3.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}