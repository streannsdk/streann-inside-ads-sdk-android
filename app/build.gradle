plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.streann.insidead.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.streann.insidead.demo"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Required because the InsideAd library uses java.time and this app is below minSdk 26.
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Pinned to 1.2.2: 1.2.3 breaks the release L8 task with
    // "Missing class jdk.internal.misc.Unsafe" (ConcurrentHashMap$TreeBin). Only the release
    // variant shrinks the desugar library, so debug builds do not catch it.
    // 2.x is not an option here - it requires AGP 7.4+ and this project is on 7.3.1.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'

    implementation project(':insidead')

    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}